<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원본 자료 안내</title><style>body{font:16px/1.8 system-ui;background:#101622;color:#e8edf5;max-width:760px;margin:12vh auto;padding:25px}h1{font-size:26px}p{color:#a9b9cc}a{color:#a7dbe8}code{overflow-wrap:anywhere;color:#d4e0ee}button{font:inherit;color:#e8edf5;background:#263c50;border:1px solid #557085;padding:9px 15px;border-radius:7px;cursor:pointer}</style><body><p>실험 결과 · 원본 자료</p><h1 id="heading">로컬 원본 파일로 확인할 수 있는 자료입니다</h1><p id="message">웹에서는 보고서와 연결된 그림·영상을 제공합니다. 원본 데이터·모델·소스 기록과 대용량 수치 파일은 로컬 실험 폴더에서 확인해 주세요.</p><p><code id="path"></code></p><button onclick="history.back()">← 보고서로 돌아가기</button><script>const q=new URLSearchParams(location.search);document.getElementById('path').textContent=q.get('file')||'';if(q.get('reason')==='missing'){document.getElementById('heading').textContent='이전 보고서가 참조한 파일을 찾지 못했습니다';document.getElementById('message').textContent='현재 로컬 자료에도 이 파일이 없습니다. 다른 실행의 자료로 대체하지 않았습니다. 결과 목록에서 대표 보고서 또는 다른 실행 기록을 확인해 주세요.';}</script></body></html>
