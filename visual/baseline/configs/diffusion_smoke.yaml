# Smoke test of diffusion.yaml: 10 collected episodes, 200 steps. It checks that
# LeRobot accepts the policy keys and that train -> checkpoint -> evaluate runs;
# its success rate means nothing.
#
# Run: bash visual/baseline/smoke_test.sh
trainer: visual.baseline.train:train
output_dir: outputs/visual_baseline_smoke/diffusion

data:
  episodes: data/visual_baseline/episodes_smoke
  validation_episodes: 2
  max_train_episodes: 8
  use_state: true
  use_depth: false

policy:
  # Every key except type is passed to lerobot DiffusionConfig.
  type: diffusion
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  noise_scheduler_type: DDIM
  num_inference_steps: 16
  # Random 248 px crop of the 256 px input = at most ±4 px shift, like ACT's
  # random_shift; evaluation uses the center crop.
  crop_shape: [248, 248]
  crop_is_random: true

train:
  seed: 0
  steps: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-6
  warmup_steps: 20
  grad_clip: 10.0
  random_shift: 0
  state_noise: 0.0
  # Diffusion clips samples to [-1, 1], so actions use min/max scaling.
  action_normalization: min_max
  log_every: 20
  eval_every: 100
  save_every: 200
