# ACT baseline on the shared-camera expert episodes.
#
# The original run's YAML was never committed. Values below come from
# visual_baseline/FINDINGS.md on branch feature/visual-baseline-results
# (chunk 50, temporal ensembling, 256 px main+wrist RGB + robot state,
# 100k steps) and otherwise LeRobot 0.7 ACT defaults. Results are therefore
# not an exact reproduction of the 2026-11 run.
#
# Run: python main.py --config visual/baseline/configs/act.yaml
trainer: visual.baseline.train:train
output_dir: outputs/visual_baseline_shared/act

data:
  episodes: data/visual_baseline/episodes_shared_camera
  validation_episodes: 45
  use_state: true
  use_depth: false

policy:
  # Every key except type is passed to lerobot ACTConfig.
  type: act
  chunk_size: 50
  n_action_steps: 1
  temporal_ensemble_coeff: 0.01

train:
  seed: 0
  steps: 100000
  batch_size: 32
  lr: 1.0e-5
  weight_decay: 1.0e-4
  warmup_steps: 500
  grad_clip: 10.0
  # The camera is fixed, so translating images blurs absolute position; keep it small.
  random_shift: 4
  state_noise: 0.0
  action_normalization: mean_std
  log_every: 200
  eval_every: 5000
  save_every: 25000
