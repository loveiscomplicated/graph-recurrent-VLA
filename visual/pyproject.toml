[project]
name = "visual-prototype"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0+cu128",
  "torchvision==0.23.0+cu128",
  "triton==3.4.0",
  "numpy==2.1.2",
  "pillow==11.0.0",
  "mani-skill==3.0.1",
  "sapien==3.0.3",
  "transformers==5.19.0",
  "hydra-core==1.3.7",
  "iopath==0.1.10",
  "opencv-python==5.0.0.93",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "imageio==2.38.1",
  "imageio-ffmpeg==0.6.0",
  "trimesh==5.1.1",
  "transforms3d==0.4.2",
  "sam-2",
]

[tool.uv]
package = false
required-version = ">=0.9.0"
constraint-dependencies = ["huggingface-hub==1.33.0", "tokenizers==0.23.2", "pytorch-kinematics==0.7.6"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
sam-2 = { git = "https://github.com/facebookresearch/sam2", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

# Match the original installation: optional connected-components CUDA extension off.
# Keep build isolation and full runtime dependency resolution.
[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }

[tool.uv.extra-build-dependencies]
sam-2 = ["torch==2.8.0+cu128"]
