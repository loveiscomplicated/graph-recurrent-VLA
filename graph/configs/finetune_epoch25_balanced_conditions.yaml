trainer: training.gnn.trainer:train
seed: 0
device: cpu
data:
  factory: training.gnn.packed_five_mode_data:build_data
  manifest: outputs/five_mode_recovery/training_subset_manifest.json
  condition: condition_2
  include_surface: true
  expected_frames:
    train: 13632
    validation: 1298
  balanced_train_condition: condition_1
model:
  name: vertex_edge_gated_mpnn
  num_semantic_ids: 16
  hidden: 64
  layers: 2
  global_geometry: true
  readout: multiseed
  readout_seeds: 4
  readout_dim: 16
  readout_heads: 4
training:
  epochs: 40
  batch_size: 128
  gradient_clip_norm: 1.0
  early_stopping:
    patience: 8
    min_epochs: 1
    min_delta: 0.001
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  name: step
  step_size: 10
  gamma: 0.5
initial_weights: outputs/expanded_surface_corner_gnn/e18f0a2a7557492cb74ee2d4943fe5e6/best.pt
output:
  root: outputs/finetune_epoch25_balanced_conditions
