trainer: training.gnn.temporal.joint_finetuning:train
device: cuda:0
seed: 2
checkpoint: /workspace/selected_vertex_continuation_matched/training_seed_2/fc92d6f27d93470a99cbb190331d9ad1/training/a0c146fa0b5b45d985bb6fa93165f3a3/final_epoch.pt
split_manifest: /workspace/temporal_continuation_120/inputs/splits.json
