trainer: training.gnn.temporal.joint_finetuning:train_and_evaluate
device: cuda:0
seed: 2
checkpoint: /workspace/gnn_selected_validation/training_seed_2/ab6e086f27b44e0ab593a7d141aa91af/training/090925b56bda417da1993bf27c859cec/best.pt
split_manifest: /workspace/temporal_continuation_120/inputs/splits.json
selected_m0:
  dataset: /workspace/selected_vertex_m0/data
  cache_source_checkpoint: /workspace/temporal_continuation_120/inputs/cache_source_best.pt
data:
  cache_dir: /workspace/temporal_continuation_120/data/gnn_cache
  raw_root: /workspace/temporal_continuation_120/data/episodes
  require_robot: true
mode: joint_peg_hole
model:
  architecture: mamba
  backend: mamba_ssm
  d_model: 128
  n_layers: 1
  d_state: 16
  d_conv: 4
  expand: 2
  head_hidden: 64
  position_mode: residual
  position_scale_m: 0.01
training:
  epochs: 500
  episode_batch_size: 4
  sequence_length: 64
  context_policy: reset_windows
  lr: 0.001
  gradient_clip_norm: 1.0
  cuda_memory_fraction: 0.25
  early_stopping:
    patience: 30
    min_epochs: 60
    min_delta: 0.0
loss:
  ablation: pose_relative_full
  position_unit_m: 0.01
  rotation_unit_rad: 0.1
evaluation:
  batch_size: 64
  split: test
  plot_episodes: 3
  latency_warmup_steps: 10
  latency_steps: 100
output:
  root: /workspace/joint_node_token_early_stopping/training/seed_2
evaluation_selection: /workspace/temporal_continuation_120/inputs/validation_frames.jsonl
temporal_checkpoint: /workspace/node_token_early_stopping/training/seed_2/ab6c964532824f13b9acc382b5901fb5/best.pt
joint_finetuning:
  gnn_lr: 1.0e-05
  temporal_lr: 0.0001
comparison_output: /workspace/joint_node_token_early_stopping/evaluation/seed_2
