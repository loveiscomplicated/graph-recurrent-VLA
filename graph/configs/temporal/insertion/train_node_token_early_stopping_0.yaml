trainer: training.gnn.temporal.node_token_mamba:train_and_evaluate
device: cuda:0
seed: 0
checkpoint: /workspace/gnn_selected_validation/training_seed_0/80ba420034254d7e8ed7201acfd79787/training/b18af96c7aed4029bd582a9c55abc9c1/best.pt
split_manifest: /workspace/temporal_continuation_120/inputs/splits.json
selected_m0:
  dataset: /workspace/selected_vertex_m0/data
  cache_source_checkpoint: /workspace/temporal_continuation_120/inputs/cache_source_best.pt
data:
  cache_dir: /workspace/temporal_continuation_120/data/gnn_cache
  raw_root: /workspace/temporal_continuation_120/data/episodes
  require_robot: true
mode: joint_peg_hole
model:
  architecture: mamba
  backend: mamba_ssm
  d_model: 128
  n_layers: 1
  d_state: 16
  d_conv: 4
  expand: 2
  head_hidden: 64
  position_mode: residual
  position_scale_m: 0.01
training:
  epochs: 500
  episode_batch_size: 4
  sequence_length: 64
  context_policy: reset_windows
