    patience: 30
    min_epochs: 60
    min_delta: 0.0
loss:
  ablation: pose_relative_full
  position_unit_m: 0.01
  rotation_unit_rad: 0.1
evaluation:
  batch_size: 64
  split: test
  plot_episodes: 3
  latency_warmup_steps: 10
  latency_steps: 100
output:
  root: /workspace/node_token_early_stopping/training/seed_0
