trainer: training.gnn.temporal.insertion:train
device: cpu
seed: 0
checkpoint: outputs/gnn_training/4186cdeb0fdb449ea443f28e3bddc936/best.pt
split_manifest: /workspace/gnn_cache/metadata/temporal_insertion_splits.json
data:
  cache_dir: /workspace/gnn_cache
  raw_root: /workspace/episodes
  require_robot: true
  independent_cache_dir: null
  independent_raw_root: null
mode: joint_peg_hole
model:
  architecture: mamba  # Set gru for the same-feature comparator.
  backend: torch_reference  # Explicit CPU reference; mamba_ssm requires CUDA.
  d_model: 128
  n_layers: 1
  d_state: 16
  d_conv: 4
  expand: 2
  head_hidden: 64
  position_mode: residual
  position_scale_m: 0.01
training:
  epochs: 20
  episode_batch_size: 4
  sequence_length: 64
  context_policy: reset_windows
  lr: 0.001
  gradient_clip_norm: 1.0
loss:
  ablation: pose_relative_full
  position_unit_m: 0.01
  rotation_unit_rad: 0.1
  weights:
    peg_position: 1.0
    peg_rotation: 1.0
    hole_position: 1.0
    hole_rotation: 1.0
    relative_position: 1.0
    lateral_position: 1.0
    relative_orientation: 1.0
evaluation:
  batch_size: 64
output:
  root: outputs/temporal_insertion_training
