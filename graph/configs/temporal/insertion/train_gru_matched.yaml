trainer: training.gnn.temporal.insertion:train_and_compare
device: cuda:0
seed: 0
checkpoint: /workspace/temporal_insertion_data/published_inputs/best.pt
split_manifest: /workspace/temporal_insertion_data/temporal_insertion_splits.json
data:
  cache_dir: /workspace/temporal_insertion_data/gnn_cache
  raw_root: /workspace/temporal_insertion_data/episodes
  require_robot: true
  independent_cache_dir: null
  independent_raw_root: null
mode: joint_peg_hole
model:
  architecture: gru
  backend: torch_reference  # Native torch_gru; no Mamba mixer is constructed.
  d_model: 128
  n_layers: 1
  d_state: 16  # Mamba-only fields are retained for config comparison.
  d_conv: 4
  expand: 2
  head_hidden: 64
  position_mode: residual
  position_scale_m: 0.01
training:
  epochs: 20
  episode_batch_size: 4
  sequence_length: 64
  context_policy: reset_windows
  lr: 0.001
  gradient_clip_norm: 1.0
  cuda_memory_fraction: 0.4
  loss: huber
  huber_delta_m: 0.01
loss:
  ablation: pose_relative_full
  rotation_objective: geodesic_huber
  position_unit_m: 0.01
  rotation_unit_rad: 0.1
  weights:
    peg_position: 1.0
    peg_rotation: 1.0
    hole_position: 1.0
    hole_rotation: 1.0
    relative_position: 1.0
    lateral_position: 1.0
    relative_orientation: 1.0
evaluation:
  split: validation
  batch_size: 32
  phase_labels: null
  visibility_labels: null
  motion_threshold_m: 0.001
  motion_threshold_rad: 0.01
  lag_max_frames: 10
  long_occlusion_frames: 20
  plot_episodes: 3
  latency_warmup_steps: 3
  latency_steps: 10
  benchmark_training: false
rule_memory:
  min_target_nodes: 5
  min_mean_confidence: 0.0
  min_confidence_fraction: 0.0
  consecutive_frames: 1
  max_spread_m: 0.01
comparison:
  reference_sha256: ca6c6931e421d0bba776b8787038b0d16b87bc203bd82e1c757ac3053ed83069
  learned_gate: /workspace/temporal_insertion_data/published_inputs/learned_gate.pt
  checkpoints:
    mamba: /workspace/temporal_insertion_mamba/training/94c59d23eeba486a81adfa221fa829c3/best.pt
output:
  root: /workspace/temporal_insertion_gru_matched/training
  comparison_root: /workspace/temporal_insertion_gru_matched/validation
