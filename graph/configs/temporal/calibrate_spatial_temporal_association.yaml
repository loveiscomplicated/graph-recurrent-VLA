trainer: evaluation.spatial_temporal_association_calibration:calibrate
device: cuda:0
checkpoint: /path/to/spatial_temporal_corner_tracker/best.pt
checkpoint_sha256: null
data:
  manifest: outputs/spatial_temporal_corner_tracking/data/manifest.json
calibration:
  max_seeds: 4
  distance_limits_m: [0.01, 0.02, 0.03, 0.05]
  embedding_weights_m: [0.0, 0.005, 0.01]
  max_tracks_per_frame: 128
  log_every_episodes: 5
output:
  root: outputs/spatial_temporal_association_calibration
