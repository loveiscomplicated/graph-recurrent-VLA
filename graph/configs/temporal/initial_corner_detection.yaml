trainer: evaluation.initial_corner_detection:evaluate
output_root: outputs/initial_corner_detection
peg_audits:
  - outputs/peg_robot_occlusion/results.json
  - outputs/peg_robot_occlusion_expanded/results.json
hole_audit: outputs/hole_corner_occlusion/results.json
