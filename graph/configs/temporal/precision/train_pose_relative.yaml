trainer: training.gnn.temporal.pose_gru:train
device: cpu
seed: 0
checkpoint: outputs/gnn_training/4186cdeb0fdb449ea443f28e3bddc936/best.pt
split_manifest: /workspace/gnn_cache/metadata/temporal_gate_splits.json
data:
  cache_dir: /workspace/gnn_cache
  raw_root: null
  independent_cache_dir: null
  independent_raw_root: null
mode: joint_peg_hole
gru:
  head_hidden: 64
  hidden: 128
  layers: 1
  position_mode: direct
  position_scale_m: 0.1
  projection: 64
training:
  episode_batch_size: 4
  epochs: 20
  gradient_clip_norm: 1.0
  lr: 0.001
loss:
  position_unit_m: 0.01
  rotation_unit_rad: 0.1
  weights:
    hole_position: 1.0
    hole_rotation: 1.0
    peg_position: 1.0
    peg_rotation: 1.0
    relative_position: 0.25
    lateral_position: 0.25
    relative_orientation: 0.1
  ablation: pose_relative
evaluation:
  batch_size: 64
output:
  root: outputs/temporal_precision_pose_relative
