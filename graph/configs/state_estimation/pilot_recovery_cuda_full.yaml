trainer: training.state21:run
base_config: graph/configs/state_estimation/compare.yaml
phase: train
seeds: [0]
device: cuda:0

models:
  - spatial
  - temporal_first
  - spatial_first
  - object_transformer
  - object_mamba

data:
  kind: tapnext_state36
  sources:
    pilot:
      cache: outputs/shared_tracking_cache/tapnext_state36.npz
      source_manifest: outputs/mixed_trajectory_pilot/manifest.json
    recovery:
      cache: outputs/shared_tracking_cache/tapnext_recovery_state36.npz
      source_manifest: outputs/mixed_trajectory_recovery/manifest.json
  split_reference: outputs/state_estimation/shared_tapnext_smoke/verification.json
  camera: base_camera
  history: 4
  split_seed: 0
  validation_seed_count: 10
  test_seed_count: 10

training:
  epochs: 1
  progress_every_batches: 400

evaluation:
  split: validation

output:
  root: outputs/state_estimation/pilot_recovery_cuda_full
