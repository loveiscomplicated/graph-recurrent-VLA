# python main.py --config graph/configs/train_gated_mpnn.yaml
# Initialization only; no data loading or training.
trainer: training.gnn_trainer:train
device: auto
seed: 0

model:
  name: vertex_edge_gated_mpnn
  # Example vocabulary size; replace with the selected vertex semantic IDs.
  num_semantic_ids: 16
  hidden: 128
  layers: 3
  edge_embedding_dim: 16
  dropout: 0.0
  coord_scale_m: 0.05
  size_scales_m: [0.04, 0.01, 0.01, 0.02]
