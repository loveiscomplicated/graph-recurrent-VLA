# Server training: set data.root to extracted raw episodes.
trainer: training.gnn.trainer:train
device: auto
seed: 0
model:
  name: vertex_edge_gated_mpnn
  num_semantic_ids: 16
  use_semantic_ids: false
  use_confidence: false
  hidden: 64
  layers: 2
  edge_embedding_dim: 16
  dropout: 0.0
  coord_scale_m: 0.05
  size_scales_m:
  - 0.04
  - 0.01
  - 0.01
  - 0.02
mode: train
data:
  root: data/visible_peg_dataset
  manifest: dataset_manifest.json
  camera: base_camera
  validation_fraction: 0.2
  test_fraction: 0.1
  frame_stride: 1
  empty_inputs: keep
  num_workers: 0
  use_cache: true
  cache_dir: outputs/gnn_cache
detector:
  device: cpu
  parameters: {}
graph:
  intra_k: null
  cross_k: null
confidence:
  residual_scale_px: 2.0
  plane_reference: 3.0
  source_reference: 3.0
  residual_weight: 0.6
  plane_weight: 0.3
  source_weight: 0.1
task:
  factory: training.gnn.tasks:Object21Task
  settings:
    pos_unit_m: 0.01
    consistency_weight: 0.05
    size_units_m:
    - 0.04
    - 0.01
    - 0.01
    - 0.02
training:
  epochs: 30
  batch_size: 32
  log_interval_seconds: 10.0
  gradient_clip_norm: 1.0
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
scheduler:
  name: step
  step_size: 10
  gamma: 0.5
output:
  root: outputs/gnn_training
resume: null
