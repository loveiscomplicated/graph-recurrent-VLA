trainer: training.gnn.trainer:train
seed: 0
device: cpu
data:
  factory: training.gnn.expanded_surface_data:build_data
  original_surface:
    visibility_index: outputs/five_mode_import/visibility/original_surface_frames.json
    cache_manifest: outputs/five_mode_import/visibility/surface_base/manifest.json
  imported_surface:
    visibility_index: outputs/five_mode_import/visibility/condition_1_archive_frames.json
    cache_manifest: outputs/five_mode_import/visibility/surface_train/manifest.json
  expected_frames:
    train: 41256
    validation: 2144
model:
  name: vertex_edge_gated_mpnn
  num_semantic_ids: 16
  hidden: 64
  layers: 2
  global_geometry: true
  readout: multiseed
  readout_seeds: 4
  readout_dim: 16
  readout_heads: 4
training:
  epochs: 80
  batch_size: 128
  gradient_clip_norm: 1.0
  early_stopping:
    patience: 8
    min_epochs: 41
    min_delta: 0.001
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
scheduler:
  name: step
  step_size: 10
  gamma: 0.5
output:
  root: outputs/expanded_surface_corner_gnn
resume: outputs/expanded_surface_corner_gnn/e18f0a2a7557492cb74ee2d4943fe5e6/last.pt
