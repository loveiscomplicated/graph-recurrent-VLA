trainer: training.gnn.vertex_family:train
family_dataset: /workspace/vertex_family_all_frames/data/047e52c778a74c81b2520dbad8c564ba
device: cuda:0
torch_threads: 4
seeds:
- 0
- 1
- 2
modes:
- baseline
- detector
- oracle
- type_control
recipe:
  model:
    name: vertex_edge_gated_mpnn
    num_semantic_ids: 16
    use_semantic_ids: false
    use_confidence: false
    hidden: 64
    layers: 2
    edge_embedding_dim: 16
    dropout: 0.0
    coord_scale_m: 0.05
    size_scales_m:
    - 0.04
    - 0.01
    - 0.01
    - 0.02
    global_geometry: true
    geometry_dim: 16
    readout: multiseed
    readout_seeds: 4
    readout_dim: 16
    readout_heads: 4
  mode: train
  graph:
    intra_k: null
    cross_k: null
  confidence:
    residual_scale_px: 2.0
    plane_reference: 3.0
    source_reference: 3.0
    residual_weight: 0.6
    plane_weight: 0.3
    source_weight: 0.1
  task:
    factory: training.gnn.tasks:Object21Task
    settings:
      pos_unit_m: 0.01
      consistency_weight: 0.05
      size_units_m:
      - 0.04
      - 0.01
      - 0.01
      - 0.02
  training:
    compile:
      enabled: true
      dynamic: true
    epochs: 60
    batch_size: 32
    log_interval_seconds: 10.0
    gradient_clip_norm: 1.0
    early_stopping:
      patience: 8
      min_epochs: 15
      min_delta: 0.001
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: step
    step_size: 10
    gamma: 0.5
output:
  root: /workspace/vertex_family_all_frames/training
