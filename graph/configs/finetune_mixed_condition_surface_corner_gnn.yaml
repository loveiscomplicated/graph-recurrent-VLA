trainer: training.gnn.trainer:train
seed: 0
device: cpu
data:
  factory: training.gnn.expanded_surface_data:build_data
  condition: condition_2
  original_surface:
    visibility_index: outputs/five_mode_import/visibility/condition_2_finetune_frames.json
    cache_manifest: outputs/five_mode_import/visibility/condition_2_surface_finetune/manifest.json
  expected_frames:
    train: 46112
    validation: 151
  imported_surface:
    visibility_index: outputs/five_mode_import/visibility/condition_2_archive_frames.json
    cache_manifest: outputs/five_mode_import/visibility/condition_2_surface_train/manifest.json
  additional_train:
    condition_1:
    - visibility_index: outputs/five_mode_import/visibility/original_surface_frames.json
      cache_manifest: outputs/five_mode_import/visibility/surface_base/manifest.json
      cache_splits: [train, validation]
    - visibility_index: outputs/five_mode_import/visibility/condition_1_archive_frames.json
      cache_manifest: outputs/five_mode_import/visibility/surface_train/manifest.json
model:
  name: vertex_edge_gated_mpnn
  num_semantic_ids: 16
  hidden: 64
  layers: 2
  global_geometry: true
  readout: multiseed
  readout_seeds: 4
  readout_dim: 16
  readout_heads: 4
training:
  epochs: 40
  batch_size: 128
  gradient_clip_norm: 1.0
  early_stopping:
    patience: 8
    min_epochs: 1
    min_delta: 0.001
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  name: step
  step_size: 10
  gamma: 0.5
output:
  root: outputs/mixed_condition_surface_corner_gnn
initial_weights: outputs/expanded_surface_corner_gnn/a02a4fdc46ee4e2f822e507978dd7839/best.pt
