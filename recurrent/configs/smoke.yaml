name: smoke
data: outputs/recurrent/data/smoke_demos.npz
out_dir: outputs/recurrent/exp/smoke
corruption: corruption.yaml

models: [mlp, stack_mlp, gru, lstm, cfc, rkn, mamba]
levels: [none, high]
seeds: [0]
model_overrides: []

train:
  steps: 20
  batch: 4
  lr: 0.001
  num_demos: null
  val_frac: 0.2
  split_seed: 0
  device: auto
  threads: 1
  log_every: 10

eval:
  checkpoint: best
  episodes: 1
  start_seed: 2000
  horizon: 250
  with_expert: true
  conditions:
    normal: {}
    hole_shift: {shift_dx: 0.02, shift_delay: 10}
  cross_eval_clean: true
  stress:
    train_levels: [high]
    blackout_lengths: [0, 20]

parallel:
  train_workers: auto
  eval_workers: auto
