trainer: evaluation.surface_mamba_controller:evaluate
mode: closed_loop
output: /workspace/surface_mamba/evaluation_v2/closed_loop_lk_comparison
resume: true
controller_device: cuda:0
seeds_file: /workspace/surface_mamba/evaluation_seeds.json
horizon: 250
comparison_reference: graph_only_single
candidates:
  graph_only_single:
    input: graph
    checkpoints:
      - /workspace/surface_mamba/training_v2/graph_only/seed_0/mamba_seed_0/best.pt
  mixed_ensemble:
    input: graph
    checkpoints:
      - /workspace/surface_mamba/training_v2/mixed/seed_0/mamba_seed_0/best.pt
      - /workspace/surface_mamba/training_v2/mixed/seed_1/mamba_seed_1/best.pt
      - /workspace/surface_mamba/training_v2/mixed/seed_2/mamba_seed_2/best.pt
      - /workspace/surface_mamba/training_v2/mixed/seed_3/mamba_seed_3/best.pt
      - /workspace/surface_mamba/training_v2/mixed/seed_4/mamba_seed_4/best.pt
environment:
  device: cpu
  render_backend: cuda
  observation_device: cuda
  max_episode_steps: 250
frontend:
  device: cuda:0
  surface_tracking: lk
  detector:
    device: cuda:0
    optimized: true
    crop_cuda_host_components: true
    batch_cuda_hole_ransac: true
    optimize_cuda_box_cube: true
    optimize_cuda_plane_preparation: true
    batch_cuda_contour_validation: true
    skip_stable_cuda_hole_refits: true
    native_cuda_hole_ransac: true
  tracker:
    path: /workspace/surface_mamba/checkpoints/surface_tracker_best.pt
    sha256: f98c4ef1c77d25fa059e9f9cf048fb1f190bcf74302a0fe1367bfe1341236afc
  gnn:
    path: /workspace/surface_mamba/checkpoints/surface_gnn_best.pt
    sha256: 0f4d9d6fd6ce615125698e243b259fad92557a3f5c5848aafe24a85277720241
