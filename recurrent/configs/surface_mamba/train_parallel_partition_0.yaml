trainer: training.surface_mamba_parallel:launch
output: /workspace/surface_mamba/training_launcher_v2_partition_0
resume: true
gpu_ids: auto
python: .venv/bin/python
base_training:
  trainer: training.surface_mamba_controller:train
  dataset: /workspace/surface_mamba/state36
  resume: true
  device: cuda:0
  cpu_threads: 2
  model:
    d_model: 96
    d_state: 16
    d_conv: 4
    expand: 2
    layers: 2
  training:
    # This is a runaway safety cap. Validation early stopping determines convergence.
    max_steps: 20000
    batch_size: 8
    gradient_clip_norm: 1.0
    validation_interval: 100
    checkpoint_interval: 500
    optimizer:
      type: adamw
      learning_rate: 0.001
      weight_decay: 0.0
    scheduler:
      type: reduce_on_plateau
      factor: 0.5
      patience_validations: 5
      min_learning_rate: 0.00001
    early_stopping:
      patience_validations: 15
      min_delta: 0.0001
experiments:
  - name: mixed
    output: /workspace/surface_mamba/training_v2/mixed
    seeds: [0, 1, 2]
    mixing:
      alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
