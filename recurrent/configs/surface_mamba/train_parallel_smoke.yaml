trainer: training.surface_mamba_parallel:launch
output: /workspace/surface_mamba/training_launcher_smoke_v2
resume: true
gpu_ids: auto
python: .venv/bin/python
base_training:
  trainer: training.surface_mamba_controller:train
  dataset: /workspace/surface_mamba/state36
  resume: true
  device: cuda:0
  cpu_threads: 2
  model:
    d_model: 16
    d_state: 4
    d_conv: 3
    expand: 1
    layers: 1
  training:
    max_steps: 2
    batch_size: 2
    gradient_clip_norm: 1.0
    validation_interval: 1
    checkpoint_interval: 1
    optimizer:
      type: adamw
      learning_rate: 0.001
      weight_decay: 0.0
    scheduler:
      type: reduce_on_plateau
      factor: 0.5
      patience_validations: 1
      min_learning_rate: 0.00001
    early_stopping:
      patience_validations: 2
      min_delta: 0.0001
experiments:
  - name: mixed_smoke
    output: /workspace/surface_mamba/training_smoke_v2/mixed
    seeds: [0, 1, 2, 3, 4]
    mixing:
      alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
  - name: graph_only_smoke
    output: /workspace/surface_mamba/training_smoke_v2/graph_only
    seeds: [0]
    mixing:
      alphas: [1.0]
